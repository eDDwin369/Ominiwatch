name: Deploy to Staging

env:
  IMAGE_NAME: base-application
  HELM_REPO: Digital-Twin-Operations/helm-charts
  HELM_CHART: base-application

on:
  push:
    branches:
      - stage
  workflow_dispatch:

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_STAGE }}
          SONAR_HOST_URL: https://sonarqube.oomnieye.com
        with:
          args: >
            -Dsonar.projectKey=base-application-stage

      - name: SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_STAGE }}
        continue-on-error: true

  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive short image tag
        run: echo "IMAGE_TAG=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout helm repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HELM_REPO }}
          ssh-key: ${{ secrets.HELM_DEPLOY_KEY }}
          path: helm-repo
          ref: main

      - name: Update stage Helm values and deploy
        working-directory: helm-repo
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          YQ_VERSION=v4.30.8
          curl -sL https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          yq eval ".image.tag = strenv(IMAGE_TAG)" -i ${{ env.HELM_CHART }}/values-stage.yaml
          git add ${{ env.HELM_CHART }}/values-stage.yaml
          git commit -m "ci(${{ env.IMAGE_NAME }}): update stage image tag to $IMAGE_TAG" || echo "no changes to commit"
          git push origin main || echo "push failed or no changes"

  deploy-help-api:
    # Separate job from `deploy` above: the frontend (root Dockerfile) and
    # help-api (api/Dockerfile) are two independent images/deployments, so
    # only build+redeploy this one when api/ actually changed - otherwise
    # every unrelated frontend push would also rebuild/redeploy help-api for
    # nothing.
    runs-on: ubuntu-latest
    environment: staging
    env:
      IMAGE_NAME: help-api
      HELM_CHART: help-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if api/ changed
        id: filter
        run: |
          if git diff --quiet HEAD^ HEAD -- api/ 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.filter.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Derive short image tag
        if: steps.filter.outputs.changed == 'true'
        run: echo "IMAGE_TAG=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        if: steps.filter.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push help-api Docker image
        if: steps.filter.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout helm repository
        if: steps.filter.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HELM_REPO }}
          ssh-key: ${{ secrets.HELM_DEPLOY_KEY }}
          path: helm-repo
          ref: main

      - name: Update stage Helm values and deploy
        if: steps.filter.outputs.changed == 'true'
        working-directory: helm-repo
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          YQ_VERSION=v4.30.8
          curl -sL https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          yq eval ".image.tag = strenv(IMAGE_TAG)" -i ${{ env.HELM_CHART }}/values-stage.yaml
          git add ${{ env.HELM_CHART }}/values-stage.yaml
          git commit -m "ci(${{ env.IMAGE_NAME }}): update stage image tag to $IMAGE_TAG" || echo "no changes to commit"
          git push origin main || echo "push failed or no changes"

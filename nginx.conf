server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # App shell: always revalidate, so after a deploy the browser picks up the new
    # index.html (which names the new hashed bundles) instead of a stale copy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Static files: long-lived cache for files that exist. A missing file — e.g. a new
    # hashed bundle requested from a pod that hasn't rolled over yet — returns a 404
    # marked no-store, so Cloudflare and browsers never cache the miss.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        error_page 404 = @static_missing;
    }

    location @static_missing {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # Help Management API service (see api/). Preserves the /api prefix.
    #
    # ^~ is required: without it, nginx checks the regex static-asset-cache
    # location above against every URI first (regex locations always beat a
    # plain prefix location), so any upload whose filename/key happens to end
    # in .png/.jpg/.js/etc (e.g. /api/media/upload/<key>.png) matched that
    # block instead of this one and 404'd before ever reaching the API.
    # ^~ tells nginx "this prefix wins outright, skip the regex check."
    location ^~ /api/ {
        proxy_pass http://help-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
